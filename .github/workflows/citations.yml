name: Update citation counts

on:
  schedule:
    - cron: '17 4 * * 1' # every Monday, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to kick off the deploy once the counts change

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch citation counts
        run: python3 bin/update_citations.py
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }} # optional, raises the rate limit

      - name: Commit and rebuild the site if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "counts unchanged, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          git commit -m "Update citation counts"
          git push
          # a push made with GITHUB_TOKEN does not trigger deploy.yml, so ask for it
          gh workflow run deploy.yml --ref master
